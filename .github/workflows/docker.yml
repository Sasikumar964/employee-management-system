name: Build and Push Docker Images

on:
  push:
    branches:
      - employee-search

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: docker build -t sasikumarpalanisamy/employee-backend:latest ./backend

      - name: Push backend image
        run: docker push sasikumarpalanisamy/employee-backend:latest

      - name: Build frontend image
        run: docker build -t sasikumarpalanisamy/employee-frontend:latest ./frontend

      - name: Push frontend image
        run: docker push sasikumarpalanisamy/employee-frontend:latest